<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InsightIQ — Intelligent Procurement Decision Support</title>
<script>
  // Applied synchronously, before first paint, to avoid a light/dark flash.
  (function () {
    try {
      var stored = localStorage.getItem("insightiq-theme");
      var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (isDark) document.documentElement.classList.add("dark");
    } catch (e) {}
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@10.18.0/dist/motion.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          navy: { DEFAULT: '#1a365d', 50:'#eef3f9', 100:'#d7e3f0', 700:'#173359', 800:'#122a49', 900:'#0d1f38' },
          slate: { DEFAULT: '#2b6cb0' },
        },
        fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] },
      }
    }
  }
</script>
<link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="font-sans antialiased">

<header class="app-header sticky top-0 z-40">
  <div class="max-w-[1600px] mx-auto px-6 py-3 flex items-center justify-between gap-6">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-[#2b7cf0] to-[#8a5cf6] flex items-center justify-center font-bold text-lg text-white shadow-[0_2px_10px_rgba(90,80,240,0.45)]">IQ</div>
      <div>
        <div class="font-bold text-lg leading-tight text-display">InsightIQ</div>
        <div class="text-[11px] leading-tight" style="color:var(--header-text-dim)">Multi-Agent Procurement Intelligence</div>
      </div>
    </div>

    <nav id="main-nav" class="hidden md:flex items-center gap-1 bg-white/5 rounded-xl p-1">
      <div id="nav-indicator"></div>
      <button data-view="dashboard" class="nav-btn">Executive Dashboard</button>
      <button data-view="pipeline" class="nav-btn">Agent Pipeline &amp; XAI</button>
      <button data-view="suppliers" class="nav-btn">Supplier Matrix</button>
      <button data-view="action" class="nav-btn">Action Hub</button>
      <button data-view="forecast" class="nav-btn">Forecast Evaluation</button>
    </nav>

    <div class="flex items-center gap-2.5 text-sm">
      <div class="hidden lg:flex items-center gap-2 mr-1" title="System health">
        <span id="health-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span style="color:var(--header-text-dim)">System Online</span>
      </div>
      <div class="hidden sm:flex items-center gap-1.5 mr-1" id="agent-status-strip"></div>

      <button id="theme-toggle" class="icon-btn theme-toggle relative" aria-label="Toggle dark mode" title="Toggle dark / light mode">
        <svg class="icon-moon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>

      <button id="alerts-btn" class="icon-btn relative" aria-label="Active alerts">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span id="alert-count" class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center">0</span>
      </button>
    </div>
  </div>
  <div class="md:hidden flex overflow-x-auto gap-1 px-3 pb-2">
    <button data-view="dashboard" class="nav-btn whitespace-nowrap">Dashboard</button>
    <button data-view="pipeline" class="nav-btn whitespace-nowrap">Pipeline &amp; XAI</button>
    <button data-view="suppliers" class="nav-btn whitespace-nowrap">Suppliers</button>
    <button data-view="action" class="nav-btn whitespace-nowrap">Action Hub</button>
    <button data-view="forecast" class="nav-btn whitespace-nowrap">Forecast</button>
  </div>
</header>

<main class="max-w-[1600px] mx-auto px-6 py-6">
  <div id="view-dashboard" class="view-panel"></div>
  <div id="view-pipeline" class="view-panel hidden"></div>
  <div id="view-suppliers" class="view-panel hidden"></div>
  <div id="view-action" class="view-panel hidden"></div>
  <div id="view-forecast" class="view-panel hidden"></div>
</main>

<div id="toast-root" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
